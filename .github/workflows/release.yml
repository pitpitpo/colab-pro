name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v2.4.0)'
        required: true
        default: 'v2.4.0'
      release_name:
        description: 'Release title'
        required: false
        default: 'Colab M3 Expressive Release'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode Release Keystore (if configured in Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build Release & Debug APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare Release Assets & Checksums
        id: assets
        run: |
          VERSION_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          mkdir -p release-assets

          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          cp "$RELEASE_APK" "release-assets/Colab-${VERSION_TAG}-release.apk"
          cp "$DEBUG_APK" "release-assets/Colab-${VERSION_TAG}-debug.apk"

          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.assets.outputs.version_tag }}
          name: ${{ github.event.inputs.release_name || format('Colab {0}', steps.assets.outputs.version_tag) }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
